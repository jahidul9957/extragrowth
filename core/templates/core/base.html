<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Ai Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0d1117; color: #e6edf3; font-family: sans-serif; padding-bottom: 80px; }
        .glass-nav { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,255,204,0.2); }
        .bottom-nav { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); }
        
        /* MUI Style Toast Alert */
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .mui-alert { animation: slideIn 0.4s ease-out; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-[#0b1120] text-slate-300 font-sans antialiased selection:bg-indigo-500 selection:text-white pb-20 md:pb-0 relative min-h-screen">

    <div class="fixed inset-0 z-[-1] opacity-30" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop'); background-size: cover; background-position: center; background-attachment: fixed;"></div>
    <div class="fixed inset-0 z-[-1] bg-gradient-to-b from-[#0b1120]/80 via-[#0b1120]/95 to-[#0b1120]"></div>

    <div id="global-loader" class="fixed inset-0 z-[100] bg-[#0b1120]/80 backdrop-blur-sm hidden flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-16 h-16 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin shadow-[0_0_15px_rgba(99,102,241,0.5)]"></div>
        <p class="mt-4 text-sm font-bold text-indigo-400 tracking-widest uppercase animate-pulse">Loading...</p>
    </div>

    <div class="max-w-md md:max-w-5xl mx-auto min-h-screen flex flex-col">
        <main class="flex-1 p-4 md:p-6 pb-24">
            {% block content %}{% endblock %}
        </main>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-[#0f172a]/90 backdrop-blur-xl border-t border-slate-800 z-50 md:hidden pb-safe">
        <div class="flex justify-around items-center p-2">
            <a href="{% url 'home' %}" class="flex flex-col items-center gap-1 p-2 text-indigo-400 nav-btn">
                <i class="fa-solid fa-house text-lg drop-shadow-[0_0_8px_rgba(99,102,241,0.5)]"></i>
                <span class="text-[9px] font-black tracking-wider uppercase">Home</span>
            </a>
            <a href="{% url 'services' %}" class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-400 transition nav-btn">
                <i class="fa-solid fa-list text-lg"></i>
                <span class="text-[9px] font-black tracking-wider uppercase">Service</span>
            </a>
            <a href="{% url 'team_rewards' %}" class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-400 transition nav-btn">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[9px] font-black tracking-wider uppercase">Team</span>
            </a>
            <a href="{% url 'api_docs' %}" class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-400 transition nav-btn">
                <i class="fa-solid fa-code text-lg"></i>
                <span class="text-[9px] font-black tracking-wider uppercase">API</span>
            </a>
            <a href="{% url 'account' %}" class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-400 transition nav-btn">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[9px] font-black tracking-wider uppercase">Account</span>
            </a>
        </div>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById("global-loader");
            // Jab kisi link par click ho (jo naye tab ya anchor me na khul raha ho)
            document.querySelectorAll("a.nav-btn, button[type='submit']").forEach(el => {
                el.addEventListener("click", () => {
                    loader.classList.remove("hidden");
                });
            });
            // Hide on pageshow (back button press par issue na aaye)
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) loader.classList.add("hidden");
            });
        });
    </script>
    
    <style>
        /* Hide scrollbar for horizontal menus */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
            
    
</body>
</html>
